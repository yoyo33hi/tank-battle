<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Tank Battle · A Battle City Homage</title>
<meta name="description" content="A retro arcade tank game in a single page. Defend your eagle, destroy the enemy tanks, clear every stage.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23090b10'/%3E%3Crect x='6' y='13' width='20' height='13' rx='2' fill='%238ce86d'/%3E%3Crect x='14' y='5' width='4' height='10' fill='%238ce86d'/%3E%3Crect x='4' y='13' width='3' height='13' fill='%233f7a2e'/%3E%3Crect x='25' y='13' width='3' height='13' fill='%233f7a2e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="hud">
      <div class="hud-brand"><span class="dot"></span>TANK BATTLE</div>
      <div class="hud-stats">
        <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="hudScore">000000</span></div>
        <div class="stat"><span class="stat-label">Stage</span><span class="stat-value" id="hudStage">1</span></div>
        <div class="stat"><span class="stat-label">Lives</span><span class="stat-value" id="hudLives">2</span></div>
        <div class="stat"><span class="stat-label">Enemies</span><span class="stat-value" id="hudEnemies">20</span></div>
        <div class="stat"><span class="stat-label">Power</span><span class="stat-value power" id="hudPower">★☆☆</span></div>
      </div>
      <div class="hud-actions">
        <button id="btnMute" class="icon-btn" type="button" aria-pressed="false">Sound On</button>
        <button id="btnPause" class="icon-btn" type="button">Pause</button>
      </div>
    </header>

    <main class="stage-wrap">
      <canvas id="game" width="624" height="624" aria-label="Tank battle playfield"></canvas>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="banner" id="banner" aria-hidden="true"></div>
      <div class="overlay" id="overlay"></div>
    </main>

    <div class="touch" id="touch" aria-hidden="true">
      <div class="dpad">
        <button type="button" data-dir="up" aria-label="Move up">▲</button>
        <button type="button" data-dir="left" aria-label="Move left">◀</button>
        <button type="button" data-dir="right" aria-label="Move right">▶</button>
        <button type="button" data-dir="down" aria-label="Move down">▼</button>
      </div>
      <button type="button" class="fire-btn" data-fire aria-label="Fire">FIRE</button>
    </div>

    <footer class="foot">
      <span><kbd>WASD</kbd> / <kbd>Arrows</kbd> move</span>
      <span><kbd>Space</kbd> fire</span>
      <span><kbd>P</kbd> pause</span>
      <span><kbd>M</kbd> mute</span>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
